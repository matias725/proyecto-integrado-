version: '3.8'
services:
  db:
    image: mysql:5.7
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: pnk_security
    volumes:
      - ./pnkSecurity/Script_BD:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
  web:
    build: ./docker/php
    restart: unless-stopped
    environment:
      - DB_HOST=db
      - DB_USER=root
      - DB_PASS=root
      - DB_NAME=pnk_security
    volumes:
      - ./pnkSecurity/pnkSecurity:/var/www/html
    ports:
      - "8000:80"
    depends_on:
      - db
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - db
