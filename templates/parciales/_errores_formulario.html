{# Errores que no pertenecen a un campo en particular #}
{% if form.non_field_errors %}
<div class="aviso error" role="alert">
    <i class="bi bi-exclamation-octagon" aria-hidden="true"></i>
    <div>{% for error in form.non_field_errors %}{{ error }}{% if not forloop.last %}<br>{% endif %}{% endfor %}</div>
</div>
{% endif %}
